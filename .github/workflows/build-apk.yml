name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34 and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x build.sh
          PKS_PASSWORD=zhangxinchuang-public-30600 bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: linjian-peek-apk
          path: android/Zhangxinchuang-public-v0.3.9.0.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.9.0
          name: 掌心窗 v0.3.9.0
          files: android/Zhangxinchuang-public-v0.3.9.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}